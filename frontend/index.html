<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Bug Diagnosis Platform</title>
</head>
<body>

    <h1>Intelligence Bug Diagnosis Platform</h1>

    <p>Submit a bug report for AI-based diagnosis and fix recommendations.</p>

    <form id="bugForm">
        <label for="title">Bug Title:</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <label for="description">Bug Description:</label><br>
        <textarea id="description" name="description" rows="8" required></textarea><br><br>

        <button type="submit">Submit Bug</button>
    </form>

    <p id="result"></p>

</body>
</html>
